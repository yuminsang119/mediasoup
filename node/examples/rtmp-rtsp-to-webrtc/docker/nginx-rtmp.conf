# Nginx RTMP Configuration
# 드론이 RTMP로 스트림을 송출하면 이 서버가 수신합니다.
# 드론 송출 URL: rtmp://<서버IP>:1935/live/<스트림키>

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

# RTMP 서버 (드론 스트림 수신)
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_streams 64;

        # 드론 라이브 스트림
        application live {
            live on;
            record off;

            # 스트림 메타데이터
            meta on;
            interleave on;

            # 대기 시간 최소화
            wait_key on;
            wait_video on;

            # 타임아웃 (드론 연결 끊김 감지)
            drop_idle_publisher 15s;

            # 접근 제어 (필요시 활성화)
            # allow publish 192.168.0.0/16;
            # deny publish all;
        }

        # CCTV RTMP 릴레이 (선택)
        application relay {
            live on;
            record off;

            # 외부 RTMP 소스 풀링
            # pull rtmp://source-server/live/stream1;
        }
    }
}

# HTTP 서버 (Nginx 상태 확인용)
http {
    server {
        listen 8080;

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
