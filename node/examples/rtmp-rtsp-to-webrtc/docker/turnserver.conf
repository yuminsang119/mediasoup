# ============================================================
# coturn TURN/STUN Server Configuration
#
# NAT 뒤에 있는 WebRTC 클라이언트가 미디어 연결을 수립하기 위해
# TURN relay가 필요합니다. 이 서버는 그 역할을 합니다.
#
# 포트:
#   3478  — STUN/TURN (UDP+TCP)
#   5349  — TURNS (TLS)
#   49152-65535 — relay 포트 범위
# ============================================================

# ── 네트워크 ──
listening-port=3478
tls-listening-port=5349

# 외부 IP (docker-compose .env의 PUBLIC_IP로 교체)
# coturn 시작 시 자동 감지되나, 명시 권장
# external-ip=PUBLIC_IP

# relay 포트 범위 (mediasoup 40000-49999와 겹치지 않음)
min-port=49152
max-port=65535

# ── 인증 ──
lt-cred-mech
realm=streaming.local
server-name=streaming.local

# 사용자 (docker-compose .env에서 설정)
# user=mediasoup:mediasoup123
# 또는 CLI로: docker exec mediasoup-coturn turnadmin -a -u USER -p PASS -r streaming.local

# ── TLS (Let's Encrypt 공유) ──
# cert=/etc/letsencrypt/live/${DOMAIN}/fullchain.pem
# pkey=/etc/letsencrypt/live/${DOMAIN}/privkey.pem

# ── 성능 ──
# relay 스레드 수 (CPU 코어 수에 맞게 조정)
relay-threads=8

# 최대 할당 수
total-quota=0
max-bps=0

# fingerprint 필수 (WebRTC 표준)
fingerprint

# ── 로깅 ──
log-file=/var/log/turnserver.log
no-stdout-log

# verbose 로그 (디버깅 시 활성화)
# verbose

# ── 보안 ──
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# stale nonce 방지
stale-nonce=600
